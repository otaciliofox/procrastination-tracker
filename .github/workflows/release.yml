name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Both modules resolve to the same signing key, which is what keeps phone/watch sync alive
      # in release builds. Without a keystore.properties present that key is the debug one, which
      # is fine for sideloading but has a caveat -- see the note at the bottom of this file.
      - name: Build release APKs
        run: ./gradlew :app:assembleRelease :wear:assembleRelease --stacktrace

      - name: Verify both APKs carry the same signature
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          PHONE=$("$BUILD_TOOLS/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep "SHA-256 digest" | head -1)
          WATCH=$("$BUILD_TOOLS/apksigner" verify --print-certs wear/build/outputs/apk/release/wear-release.apk | grep "SHA-256 digest" | head -1)
          echo "phone: $PHONE"
          echo "watch: $WATCH"
          if [ "$PHONE" != "$WATCH" ]; then
            echo "::error::Phone and watch APKs are signed with different keys -- sync would silently stop working."
            exit 1
          fi

      - name: Name the artifacts after the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/procrastination-tracker-$VERSION-phone.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "release/procrastination-tracker-$VERSION-watch.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true

# Note on signing: with no keystore.properties in the repo, each runner generates its own debug
# keystore, so APKs from two different runs do not share a signature and will not install over one
# another. That is acceptable for a sideloaded showcase build. Publishing to Play, or shipping
# updates users can install on top of an existing version, means providing a real keystore -- at
# that point the key material belongs in GitHub Secrets and gets written to keystore.properties by
# a step here, never committed.
